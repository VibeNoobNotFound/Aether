name: Nightly Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    # Skip if commit message contains [skip ci], [ci skip], or [no ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[no ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Generate Timestamp Version
        id: version
        run: echo "VERSION=$(date +'%Y.%m.%d.%H%M')" >> $GITHUB_OUTPUT

      - name: Build Backend & Bundle
        run: ./build_all.sh --bundle

      - name: Install Protobuf Tools
        run: |
          brew install protobuf swift-protobuf grpc-swift

      - name: Generate Swift Protos
        run: |
          PROTO_PATH="Protos"
          OUT_DIR="Aether.MacOS/AetherIPC/Sources/AetherIPC"
          mkdir -p "$OUT_DIR"
          
          # Get plugin paths from Homebrew
          PLUGIN_SWIFT="$(brew --prefix swift-protobuf)/bin/protoc-gen-swift"
          PLUGIN_GRPC="$(brew --prefix protoc-gen-grpc-swift)/bin/protoc-gen-grpc-swift-2"
          
          protoc \
            --plugin=protoc-gen-swift="$PLUGIN_SWIFT" \
            --plugin=protoc-gen-grpc-swift="$PLUGIN_GRPC" \
            --swift_opt=Visibility=Public \
            --grpc-swift_opt=Visibility=Public \
            --swift_out="$OUT_DIR" \
            --grpc-swift_out="$OUT_DIR" \
            --proto_path="$PROTO_PATH" \
            "$PROTO_PATH/aether.proto"
          
          echo "✅ Generated Swift Protos"

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project Aether.MacOS/Aether.xcodeproj \
            -scheme Aether \
            -destination "generic/platform=macOS" \
            -archivePath build/Aether.xcarchive \
            -configuration Release \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION=${{ steps.version.outputs.VERSION }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            | xcpretty

      - name: Export .app from Archive
        run: |
          mkdir -p build/export
          cp -R "build/Aether.xcarchive/Products/Applications/Aether.app" build/export/

      - name: Clear Quarantine Attributes
        run: |
          xattr -cr build/export/Aether.app

      - name: Create Zip
        run: |
          cd build/export
          zip -r "../Aether_${{ steps.version.outputs.VERSION }}.zip" Aether.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether_${{ steps.version.outputs.VERSION }}
          path: build/Aether_${{ steps.version.outputs.VERSION }}.zip
