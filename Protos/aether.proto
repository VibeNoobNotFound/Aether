syntax = "proto3";

option csharp_namespace = "Aether.Protos";
package aether;

// -----------------------------------------------------------
// SERVICES
// -----------------------------------------------------------

service AetherOrchestrator {
  // HEALTH CHECK
  rpc Ping (Empty) returns (PingResponse);

  // LIBRARY: Getting games into the UI
  rpc ScanLibrary (ScanRequest) returns (stream ScanProgress);
  rpc GetLibrary (Empty) returns (stream Game);
  rpc GetLibraryStats (Empty) returns (LibraryStatsResponse);
  
  // LAUNCHING: The core function
  rpc LaunchGame (LaunchRequest) returns (LaunchResponse);
  rpc CanLaunchGame (GameId) returns (CanLaunchResponse);
  rpc StopGame (GameId) returns (OperationStatus);
  rpc GetActiveProcesses (GameId) returns (ActiveProcessesResponse);
  // Streams updates (e.g., "Running", "Stopping") so the UI Play button changes color
  rpc SubscribeToGameState (Empty) returns (stream GameStateUpdate);

  // PLUGINS: The interactive layer
  // Frontend asks: "What widgets should I show for this game?"
  rpc GetGameDetailWidgets (GameId) returns (WidgetList);
  // Frontend says: "User clicked the button in the plugin widget"
  rpc TriggerPluginAction (PluginAction) returns (OperationStatus);
  
  // Get list of loaded plugins
  rpc GetPlugins (Empty) returns (PluginList);

  // Server-Driven UI: Request widgets for a specific context
  rpc GetWidgets (WidgetRequest) returns (WidgetList);

  // DATA MANAGEMENT
  rpc ClearLibrary (Empty) returns (OperationStatus);
  rpc RemoveGame (GameId) returns (OperationStatus);
  rpc ToggleFavorite (GameId) returns (OperationStatus);
  rpc OpenGameLocation (GameId) returns (OperationStatus);
  rpc ResetSystem (Empty) returns (OperationStatus);
  
  // METADATA MANAGEMENT
  rpc UpdateGameMetadata (GameMetadataUpdate) returns (OperationStatus);
  rpc SearchMetadataProviders (MetadataSearchRequest) returns (MetadataSearchResponse);
  rpc GetMetadataSettings (Empty) returns (MetadataSettings);
  rpc SetMetadataSettings (MetadataSettings) returns (OperationStatus);

  // NEWS
  rpc GetGameNews (GameId) returns (NewsList);
  rpc GetGeneralNews (Empty) returns (NewsList);

  // PLUGIN MANAGEMENT
  rpc InstallPlugin (PluginFile) returns (OperationStatus);
  rpc UninstallPlugin (PluginName) returns (OperationStatus);

  // APP UPDATES
  rpc CheckForUpdates (CheckUpdateRequest) returns (UpdateInfo);
  rpc DownloadUpdate (DownloadUpdateRequest) returns (stream DownloadProgress);
  rpc InstallAppUpdate (InstallUpdateRequest) returns (OperationStatus);

  // COLLECTIONS
  rpc GetCollections (Empty) returns (CollectionList);
  rpc CreateCollection (CreateCollectionRequest) returns (Collection);
  rpc UpdateCollection (UpdateCollectionRequest) returns (OperationStatus);
  rpc DeleteCollection (CollectionId) returns (OperationStatus);
  rpc AddGameToCollection (CollectionGameAction) returns (OperationStatus);
  rpc RemoveGameFromCollection (CollectionGameAction) returns (OperationStatus);
  rpc GetCollectionGames (CollectionId) returns (stream Game);
  rpc ReorderCollections (ReorderCollectionsRequest) returns (OperationStatus);

  // CAROUSEL
  rpc GetCarouselConfig (Empty) returns (CarouselConfig);
  rpc SetCarouselConfig (CarouselConfig) returns (OperationStatus);
  rpc GetCarouselGames (Empty) returns (stream Game);

  // SEARCH
  rpc SearchLibrary (LibrarySearchRequest) returns (LibrarySearchResponse);
}



// -----------------------------------------------------------
// DATA MODELS
// -----------------------------------------------------------

message Empty {}

// Tracked process info for StopGame confirmation dialog
message TrackedProcessInfo {
  int32 process_id = 1;
  string process_name = 2;
  string executable_path = 3;
}

message ActiveProcessesResponse {
  repeated TrackedProcessInfo processes = 1;
}

message LibrarySearchRequest {
  string query = 1;
  // bool filter_installed = 2; // Removed
  repeated string filter_platforms = 3;
  repeated string filter_genres = 4;
  
  enum SortOption {
    RELEVANCE = 0;
    NAME = 1;
    RELEASE_DATE = 2;
    PLAYTIME = 3;
  }
  SortOption sort_by = 5;
  bool sort_ascending = 6;
  int32 limit = 7;
}

message LibrarySearchResponse {
  repeated Game games = 1;
  int32 total_matches = 2;
}

message LibraryStatsResponse {
    int32 total_games = 1;
    int64 total_playtime_seconds = 2;
    int32 total_sessions = 3;
    int32 active_day_count = 4;
    repeated GenreStat top_genres = 5;
}

message GenreStat {
    string genre = 1;
    int32 count = 2;
}


message PingResponse {
  bool healthy = 1;
  string version = 2;
}

message Game {
  string id = 1;
  string title = 2;
  string platform = 3;
  string external_id = 4;
  string install_path = 5;
  string executable_path = 6;
  
  // Images & Media
  string cover_image_url = 7;
  string background_image_url = 8;
  string logo_image_url = 9;
  repeated string screenshots = 10;
  repeated string videos = 11;
  
  // Description & Classification
  string description = 12;
  string short_description = 13;
  repeated string genres = 14;
  repeated string tags = 15;
  repeated string categories = 16;
  
  // People & Dates
  string developer = 17;
  string publisher = 18;
  int64 release_date_unix = 19; // Unix timestamp
  
  // Ratings & Reviews
  double metacritic_score = 20;
  double user_score = 21;
  int32 review_count = 22;
  
  // Features
  bool has_achievements = 23;
  int32 achievement_count = 24;
  bool has_multiplayer = 25;
  bool has_single_player = 26;
  bool has_cloud_saves = 27;
  
  // System Requirements
  string minimum_requirements = 28;
  string recommended_requirements = 29;
  repeated string supported_languages = 30;
  
  // User Stats
  int64 last_played_unix = 31; // Unix timestamp
  int64 total_playtime_seconds = 32;
  bool is_favorite = 33;
  bool is_installed = 34;
  
  // Cross-Platform News: If set, use this ID to fetch Steam News regardless of platform
  optional string steam_id = 35;

  // Launch Configuration
  string launch_arguments = 36;
  
  // Stats
  int32 play_count = 37;
}


message GameId {
  string id = 1;
}

enum Platform {
  UNKNOWN = 0;
  STEAM = 1;
  EPIC = 2;
  GOG = 3;
  LOCAL = 4;
  BATTLE_NET = 5;
}

message WidgetRequest {
  string plugin_name = 1;
  WidgetLocation location = 2;
}

enum WidgetLocation {
  SETTINGS = 0; // Plugin configuration/setup
  LIBRARY_ADD_MENU = 1; // "Add Game" menu context
  // Future: GAME_DETAIL_SIDEBAR = 2;
}

// -----------------------------------------------------------

message PluginName {
  string name = 1;
}

message ScanRequest {
  bool force_refresh = 1;
}

message ScanProgress {
  string current_status = 1; // "Scanning Steam..."
  int32 percent_complete = 2;
  Game found_game = 3; // The game that was just found (streaming)
  
  // Detailed progress
  string current_platform = 4;
  int32 games_found = 5;
  int32 games_processed = 6;
  string current_game = 7;
  float progress_percentage = 8; // Float version if needed
}

message LaunchRequest {
  string game_id = 1;
  bool run_as_admin = 2;
}

message LaunchResponse {
  bool success = 1;
  string message = 2;
  string process_id = 3;
}

message CanLaunchResponse {
  bool can_launch = 1;
  string reason = 2;           // Why it can't be launched (if can_launch is false)
  string launch_method = 3;    // "steam", "epic", "appstore", "direct", etc.
}

message OperationStatus {
  bool success = 1;
  string message = 2;
  int64 playtime_seconds = 16;
  int64 last_played_unix = 17;
  int32 play_count = 18;
}

message GameStateUpdate {
  string game_id = 1;
  GameState state = 2;
}

enum GameState {
  STOPPED = 0;
  RUNNING = 1;
  LAUNCHING = 2;
}

// Plugin UI Models
message WidgetList {
  repeated UIWidget widgets = 1;
}

// New Unified Widget Model
message UIWidget {
  string id = 1;

  // Layout & Style
  WidgetStyle style = 2;
  int32 sort_order = 3;

  // The actual widget data
  oneof content {
    TextWidget text = 10;
    ButtonWidget button = 11;
    ImageWidget image = 12;
    ContainerWidget container = 13; // For Row/Column/Form layouts
    
    // Form Inputs
    TextInputWidget text_input = 20; 
    FolderPickerWidget folder_picker = 21;
    FilePickerWidget file_picker = 22;
    ToggleWidget toggle = 23;
  }
}

message WidgetStyle {
  optional string background_color = 1; // Hex
  optional double padding_vertical = 2; // Standardized spacing
  optional double padding_horizontal = 3;
}

message TextWidget {
  string text = 1;
  enum Variant {
    BODY = 0;
    HEADLINE = 1;
    CAPTION = 2; // For descriptions
    SECTION_HEADER = 3;
    ERROR = 4;
  }
  Variant variant = 2;
  string color = 3;   // "Primary", "Secondary", "Accent"
}

message ButtonWidget {
  string label = 1;
  string icon = 2; // SF Symbol name
  string action_id = 3; 
  string payload_json = 4; // Optional data to send back
  
  enum Style {
    DEFAULT = 0;
    PRIMARY = 1; // Highlighted (e.g. Save)
    DESTRUCTIVE = 2; // Red (e.g. Delete)
    LINK = 3;
  }
  Style style = 5;
}

message ImageWidget {
    string url = 1;
    enum Size {
        SMALL = 0;
        MEDIUM = 1;
        LARGE = 2;
        FULL_WIDTH = 3;
    }
    Size size = 2;
    string caption = 3;
}

message TextInputWidget {
  string label = 1;
  string placeholder = 2;
  string initial_value = 3;
  string bound_field_id = 4; // ID for form submission
  bool is_required = 5;
  bool is_secure = 6;
}

message FolderPickerWidget {
   string label = 1;
   string bound_field_id = 2;
   bool is_required = 3;
}

message FilePickerWidget {
   string label = 1;
   string bound_field_id = 2;
   bool is_required = 3;
   string allowed_extensions = 4; // e.g., ".exe,.sh"
}

message ToggleWidget {
    string label = 1;
    string bound_field_id = 2;
    bool initial_value = 3;
}

message ContainerWidget {
  enum Orientation {
    VERTICAL = 0;
    HORIZONTAL = 1;
    FORM = 2; // Renders children with Form styling (labels aligned, spacing)
  }
  Orientation orientation = 1;
  repeated UIWidget children = 2;
  repeated WidgetAction actions = 3; // Actions associated with this container (e.g. Form Submit)
}

message WidgetAction {
    string id = 1;
    string label = 2;
    string type = 3; // "Submit", "Cancel", "Link"
}

message PluginAction {
  string plugin_name = 1;
  string action_id = 2;
  string payload_json = 3; // JSON payload for form data etc.
}

message PluginList {
  repeated PluginInfo plugins = 1; 
}

message PluginInfo {
  string name = 1;
  string version = 2;
  string author = 3;
  bool is_enabled = 4;
  bool is_importer = 5;
  bool is_metadata_provider = 6;
  bool supports_manual_addition = 7;
  repeated string supported_platforms = 8;
  bool is_game_launcher = 9;
  bool is_news_provider = 10;
}

// Metadata Management
message GameMetadataUpdate {
  string game_id = 1;
  optional string title = 2;
  optional string developer = 3;
  optional string publisher = 4;
  optional string description = 5;
  optional string cover_image_url = 6;
  optional string background_image_url = 7;
  repeated string genres = 8;
  repeated string screenshots = 9;
  optional int64 release_date_unix = 10;
  repeated string videos = 11;
  optional string logo_image_url = 12;
  optional string steam_id = 13;  // For cross-platform news
  optional string launch_arguments = 14; 
  optional int32 metacritic_score = 15;
}

message MetadataSearchRequest {
  string query = 1;
  string provider = 2;
}

message MetadataSearchResponse {
  repeated MetadataSearchResult results = 1;
}

message MetadataSearchResult {
  string title = 1;
  string developer = 2;
  string cover_image_url = 3;
  string provider = 4;
  string external_id = 5;
  int32 release_year = 6;
  repeated string videos = 7;
  string description = 8;
  string publisher = 9;
  repeated string screenshots = 10;
  string logo_image_url = 11;
  repeated string genres = 12;
  int32 metacritic_score = 13;
}

message MetadataSettings {
  repeated string provider_priority = 1;
  repeated string available_providers = 2; // Read-only
}

message NewsItem {
  string id = 1;         // 'gid' from Steam
  string title = 2;
  string url = 3;
  string content_html = 4; // 'contents' (needs stripping/sanitizing on front)
  string author = 5;      // 'author' or 'feedlabel'
  int64 date_unix = 6;    // 'date'
  string image_url = 7;   // Optional (parsed from content or unknown)
  string source = 8;      // "Steam", "RSS", etc.
}

message NewsList {
  repeated NewsItem news = 1;
}

message PluginFile {
  string filename = 1;
  bytes data = 2;
}

// -----------------------------------------------------------
// APP UPDATE MESSAGES
// -----------------------------------------------------------

message CheckUpdateRequest {
  string current_version = 1;
  bool include_prerelease = 2;
}

message UpdateInfo {
  bool update_available = 1;
  string version = 2;
  string release_notes = 3;
  string download_url = 4;
  string html_url = 5;
  bool is_prerelease = 6;
  int64 size_bytes = 7;
}

message DownloadUpdateRequest {
  string version = 1;
}

message DownloadProgress {
  enum Status {
    DOWNLOADING = 0;
    EXTRACTING = 1;
    COMPLETE = 2;
    FAILED = 3;
  }
  Status status = 1;
  int32 percent = 2;
  int64 bytes_downloaded = 3;
  int64 total_bytes = 4;
  string error_message = 5;
  string extract_path = 6;
}

message InstallUpdateRequest {
  string extract_path = 1;
}

// -----------------------------------------------------------
// COLLECTIONS
// -----------------------------------------------------------

enum CollectionType {
  COLLECTION_CUSTOM = 0;
  COLLECTION_FAVORITES = 1;
  COLLECTION_RECENTLY_PLAYED = 2;
  COLLECTION_PLATFORM = 3;
}

message Collection {
  int32 id = 1;
  string name = 2;
  string icon_name = 3;
  CollectionType type = 4;
  bool is_system = 5;
  optional string platform_filter = 6;
  repeated int32 game_ids = 7;
  int32 sort_order = 8;
  bool is_visible = 9;
  int32 game_count = 10;
}

message CollectionList {
  repeated Collection collections = 1;
}

message CollectionId {
  int32 id = 1;
}

message CreateCollectionRequest {
  string name = 1;
  string icon_name = 2;
}

message UpdateCollectionRequest {
  int32 id = 1;
  optional string name = 2;
  optional string icon_name = 3;
  optional int32 sort_order = 4;
  optional bool is_visible = 5;
}

message CollectionGameAction {
  int32 collection_id = 1;
  string game_id = 2;
}

message ReorderCollectionsRequest {
  repeated int32 collection_ids = 1;
}

message CarouselConfig {
  optional int32 collection_id = 1;
  repeated string game_ids = 2;
  int32 max_games = 3;
}
