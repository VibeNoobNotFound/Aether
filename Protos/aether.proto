syntax = "proto3";

option csharp_namespace = "Aether.Protos";
package aether;

// -----------------------------------------------------------
// SERVICES
// -----------------------------------------------------------

service AetherOrchestrator {
  // LIBRARY: Getting games into the UI
  rpc ScanLibrary (ScanRequest) returns (stream ScanProgress);
  rpc GetLibrary (Empty) returns (stream Game);
  
  // LAUNCHING: The core function
  rpc LaunchGame (LaunchRequest) returns (LaunchResponse);
  rpc CanLaunchGame (GameId) returns (CanLaunchResponse);
  rpc StopGame (GameId) returns (OperationStatus);
  // Streams updates (e.g., "Running", "Stopping") so the UI Play button changes color
  rpc SubscribeToGameState (Empty) returns (stream GameStateUpdate);

  // PLUGINS: The interactive layer
  // Frontend asks: "What widgets should I show for this game?"
  rpc GetGameDetailWidgets (GameId) returns (WidgetList);
  // Frontend says: "User clicked the button in the plugin widget"
  rpc TriggerPluginAction (PluginAction) returns (OperationStatus);
  
  // Get list of loaded plugins
  rpc GetPlugins (Empty) returns (PluginList);

  // Server-Driven UI for Plugin Setup (e.g., "Add Game" for Custom Importer)
  rpc GetSetupWidgets (PluginName) returns (WidgetList);

  // DATA MANAGEMENT
  rpc ClearLibrary (Empty) returns (OperationStatus);
  rpc RemoveGame (GameId) returns (OperationStatus);
  rpc ToggleFavorite (GameId) returns (OperationStatus);
  rpc OpenGameLocation (GameId) returns (OperationStatus);
  
  // METADATA MANAGEMENT
  rpc UpdateGameMetadata (GameMetadataUpdate) returns (OperationStatus);
  rpc SearchMetadataProviders (MetadataSearchRequest) returns (MetadataSearchResponse);

  // NEWS
  rpc GetGameNews (GameId) returns (NewsList);
  rpc GetGeneralNews (Empty) returns (NewsList);

  // PLUGIN MANAGEMENT
  rpc InstallPlugin (PluginFile) returns (OperationStatus);
  rpc UninstallPlugin (PluginName) returns (OperationStatus);
}



// -----------------------------------------------------------
// DATA MODELS
// -----------------------------------------------------------

message Empty {}

message Game {
  string id = 1;
  string title = 2;
  string platform = 3;
  string external_id = 4;
  string install_path = 5;
  string executable_path = 6;
  
  // Images & Media
  string cover_image_url = 7;
  string background_image_url = 8;
  string logo_image_url = 9;
  repeated string screenshots = 10;
  repeated string videos = 11;
  
  // Description & Classification
  string description = 12;
  string short_description = 13;
  repeated string genres = 14;
  repeated string tags = 15;
  repeated string categories = 16;
  
  // People & Dates
  string developer = 17;
  string publisher = 18;
  int64 release_date_unix = 19; // Unix timestamp
  
  // Ratings & Reviews
  double metacritic_score = 20;
  double user_score = 21;
  int32 review_count = 22;
  
  // Features
  bool has_achievements = 23;
  int32 achievement_count = 24;
  bool has_multiplayer = 25;
  bool has_single_player = 26;
  bool has_cloud_saves = 27;
  
  // System Requirements
  string minimum_requirements = 28;
  string recommended_requirements = 29;
  repeated string supported_languages = 30;
  
  // User Stats
  int64 last_played_unix = 31; // Unix timestamp
  int64 total_playtime_seconds = 32;
  bool is_favorite = 33;
  bool is_installed = 34;
  
  // Cross-Platform News: If set, use this ID to fetch Steam News regardless of platform
  optional string steam_id = 35;
}


message GameId {
  string id = 1;
}

enum Platform {
  UNKNOWN = 0;
  STEAM = 1;
  EPIC = 2;
  GOG = 3;
  LOCAL = 4;
  BATTLE_NET = 5;
}

// -----------------------------------------------------------

message PluginName {
  string name = 1;
}

message ScanRequest {
  bool force_refresh = 1;
}

message ScanProgress {
  string current_status = 1; // "Scanning Steam..."
  int32 percent_complete = 2;
  Game found_game = 3; // The game that was just found (streaming)
  
  // Detailed progress
  string current_platform = 4;
  int32 games_found = 5;
  int32 games_processed = 6;
  string current_game = 7;
  float progress_percentage = 8; // Float version if needed
}

message LaunchRequest {
  string game_id = 1;
  bool run_as_admin = 2;
}

message LaunchResponse {
  bool success = 1;
  string message = 2;
  string process_id = 3;
}

message CanLaunchResponse {
  bool can_launch = 1;
  string reason = 2;           // Why it can't be launched (if can_launch is false)
  string launch_method = 3;    // "steam", "epic", "appstore", "direct", etc.
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message GameStateUpdate {
  string game_id = 1;
  string state = 2; // "Running", "Stopped"
}

// Plugin UI Models
message WidgetList {
  repeated PluginWidget widgets = 1;
}

message PluginWidget {
  string id = 1; // Unique ID for this instance
  string plugin_id = 2; // ID of the plugin that created it
  string title = 3;
  string type = 4; // "Button", "Label", "Image", "Markdown"
  string content = 5; // Text content or Image URL
  string action_id = 6; // If it's a button, this ID is sent back on click
  string layout_json = 7; // For complex layouts (Server-Driven UI)
  int32 sort_order = 8;
}

message PluginAction {
  string plugin_name = 1;
  string action_id = 2;
  string payload_json = 3; // JSON payload for form data etc.
}

message PluginList {
  repeated PluginInfo plugins = 1; 
}

message PluginInfo {
  string name = 1;
  string version = 2;
  string author = 3;
  bool is_enabled = 4;
  bool is_importer = 5;
  bool is_metadata_provider = 6;
}

// Metadata Management
message GameMetadataUpdate {
  string game_id = 1;
  optional string title = 2;
  optional string developer = 3;
  optional string publisher = 4;
  optional string description = 5;
  optional string cover_image_url = 6;
  optional string background_image_url = 7;
  repeated string genres = 8;
  repeated string screenshots = 9;
  optional int64 release_date_unix = 10;
  repeated string videos = 11;
  optional string logo_image_url = 12;
  optional string steam_id = 13;  // For cross-platform news
}

message MetadataSearchRequest {
  string query = 1;
  string provider = 2;
}

message MetadataSearchResponse {
  repeated MetadataSearchResult results = 1;
}

message MetadataSearchResult {
  string title = 1;
  string developer = 2;
  string cover_image_url = 3;
  string provider = 4;
  string external_id = 5;
  int32 release_year = 6;
  repeated string videos = 7;
  string description = 8;
  string publisher = 9;
  repeated string screenshots = 10;
  string logo_image_url = 11;
  repeated string genres = 12;
}

message NewsItem {
  string id = 1;         // 'gid' from Steam
  string title = 2;
  string url = 3;
  string content_html = 4; // 'contents' (needs stripping/sanitizing on front)
  string author = 5;      // 'author' or 'feedlabel'
  int64 date_unix = 6;    // 'date'
  string image_url = 7;   // Optional (parsed from content or unknown)
  string source = 8;      // "Steam", "RSS", etc.
}

message NewsList {
  repeated NewsItem news = 1;
}

message PluginFile {
  string filename = 1;
  bytes data = 2;
}
